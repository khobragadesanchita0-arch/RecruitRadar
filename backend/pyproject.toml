[project]
name = "recruitradar-backend"
version = "0.1.0"
description = "RecruitRadar — AI Recruitment Intelligence Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "cryptography>=42.0.0",
    "aiosqlite>=0.20.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
